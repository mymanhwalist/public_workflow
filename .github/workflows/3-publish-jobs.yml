name: 3 — Publish Jobs

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max jobs to publish per run (default: 6)'
        required: false
        default: '6'
      dry_run:
        description: 'Dry run — print only, no DB writes'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    name: Publish refined jobs → website
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apifromurl/package-lock.json

      - name: Install dependencies
        working-directory: apifromurl
        run: npm ci

      - name: Run publisher
        working-directory: apifromurl
        env:
          MAIN_DB_URL: ${{ secrets.MAIN_DB_URL }}
          MAIN_DB_KEY: ${{ secrets.MAIN_DB_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT="6"; fi
          ARGS="--limit=$LIMIT"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node publisher.js $ARGS
