<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Endpoint Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-size: 14px;
            color: #333;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
            font-size: 13px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #45a049;
        }

        .btn-secondary {
            background-color: #f44336;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #da190b;
        }

        .btn-save {
            background-color: #2196F3;
            color: white;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-save:hover:not(:disabled) {
            background-color: #0b7dda;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
        }

        .status.hidden {
            display: none;
        }

        .status.info {
            background-color: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }

        .status.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #81c784;
        }

        .status.error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .progress {
            margin-top: 8px;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 20px 0;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h1>API Endpoint Finder</h1>

    <div class="form-group">
        <label for="supabaseUrl">Supabase URL</label>
        <input type="text" id="supabaseUrl" placeholder="https://your-project.supabase.co">
    </div>

    <div class="form-group">
        <label for="supabaseKey">Supabase API Key</label>
        <input type="password" id="supabaseKey" placeholder="Your service_role or anon key">
    </div>

    <div class="form-group">
        <label for="tableName">Table Name</label>
        <input type="text" id="tableName" placeholder="career_pages">
    </div>

    <div class="form-group">
        <label for="urlColumn">Website URL Column</label>
        <input type="text" id="urlColumn" placeholder="website_url">
        <div class="hint">Column containing website URLs</div>
    </div>

    <div class="form-group">
        <label for="apiColumn">API Endpoint Column</label>
        <input type="text" id="apiColumn" placeholder="api_endpoint">
        <div class="hint">Column to store detected API endpoints</div>
    </div>

    <button class="btn-save" id="saveConfig">Save Configuration</button>

    <div class="divider"></div>

    <div class="button-group">
        <button class="btn-primary" id="startBtn">Start</button>
        <button class="btn-secondary" id="stopBtn" disabled>Stop</button>
    </div>

    <div class="status hidden" id="status">
        <div id="statusText">Ready to start</div>
        <div class="progress" id="progress"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
