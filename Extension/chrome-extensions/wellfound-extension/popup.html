<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wellfound Companies Scraper</title>
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #333;
    }

    .status {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .status-label {
      color: #666;
    }

    .status-value {
      font-weight: 600;
      color: #333;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 500;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #4CAF50;
      color: white;
    }

    .btn-secondary {
      background: #2196F3;
      color: white;
    }

    .btn-danger {
      background: #f44336;
      color: white;
    }

    .progress {
      margin-top: 16px;
      padding: 12px;
      background: #e3f2fd;
      border-radius: 6px;
      display: none;
    }

    .progress.active {
      display: block;
    }

    .progress-text {
      color: #1976d2;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #2196F3;
      transition: width 0.3s;
    }

    .message {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .info-box {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #856404;
    }
  </style>
</head>
<body>
  <h1>🏢 Wellfound Companies</h1>

  <div class="status">
    <div class="status-item">
      <span class="status-label">Companies Scraped:</span>
      <span class="status-value" id="companiesCount">0</span>
    </div>
    <div class="status-item">
      <span class="status-label">With Career Pages:</span>
      <span class="status-value" id="careerPagesCount">0</span>
    </div>
  </div>

  <div class="info-box">
    ℹ️ Wellfound has 960 pages with ~10 companies each (9,600 total). Start small to test!
  </div>

  <div class="input-group">
    <label for="startPage">Start Page:</label>
    <input type="number" id="startPage" min="1" max="960" value="1">
  </div>

  <div class="input-group">
    <label for="endPage">End Page:</label>
    <input type="number" id="endPage" min="1" max="960" value="10">
  </div>

  <div class="button-group">
    <button id="startExtraction" class="btn-primary">
      🚀 Start Extraction
    </button>

    <button id="findCareerPages" class="btn-secondary" disabled>
      🔍 Find Career Pages
    </button>

    <button id="syncToSupabase" class="btn-secondary" disabled>
      ☁️ Sync to Supabase
    </button>

    <button id="downloadData" class="btn-secondary" disabled>
      ⬇️ Download Data
    </button>

    <button id="clearData" class="btn-danger" disabled>
      🗑️ Clear All Data
    </button>
  </div>

  <div id="progress" class="progress">
    <div class="progress-text" id="progressText">Extracting...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>

  <div id="message" class="message"></div>

  <script src="popup.js"></script>
</body>
</html>
