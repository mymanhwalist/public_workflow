<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hiring.cafe Scraper - Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px;
      background: #f9fafb;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 32px;
    }

    .section {
      background: white;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid #e5e7eb;
    }

    .section h2 {
      font-size: 18px;
      color: #374151;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Courier New', monospace;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .help-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .help-text a {
      color: #3b82f6;
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
      margin-left: 8px;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .status {
      padding: 12px 16px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .status.show {
      display: block;
    }

    .info-box {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .info-box h3 {
      font-size: 14px;
      font-weight: 600;
      color: #1e40af;
      margin-bottom: 8px;
    }

    .info-box p {
      font-size: 13px;
      color: #1e40af;
      line-height: 1.5;
    }

    .info-box code {
      background: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>⚙️ Settings</h1>
  <p class="subtitle">Configure your Supabase connection</p>

  <div class="section">
    <h2>Supabase Configuration</h2>

    <div class="info-box">
      <h3>📍 Where to find these values:</h3>
      <p>
        1. Go to your <a href="https://app.supabase.com" target="_blank">Supabase Dashboard</a><br>
        2. Select your project<br>
        3. Go to <strong>Settings → API</strong><br>
        4. Copy <code>Project URL</code> and <code>anon public</code> key
      </p>
    </div>

    <div class="form-group">
      <label for="supabaseUrl">Supabase URL</label>
      <input
        type="text"
        id="supabaseUrl"
        placeholder="https://your-project.supabase.co"
      >
      <div class="help-text">Your Supabase project URL</div>
    </div>

    <div class="form-group">
      <label for="supabaseKey">Supabase Anon Key</label>
      <input
        type="password"
        id="supabaseKey"
        placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      >
      <div class="help-text">Your Supabase anon/public API key</div>
    </div>

    <button id="saveBtn" class="btn-primary">Save Settings</button>
    <button id="testBtn" class="btn-secondary">Test Connection</button>

    <div id="status" class="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
