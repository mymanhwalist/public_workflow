<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 300px;
      background: #0f0f0f;
      color: #f0f0f0;
    }
    .header {
      background: #1a1a2e;
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a4a;
    }
    .header h1 { font-size: 14px; font-weight: 600; color: #7c9ff7; }
    .header p  { font-size: 11px; color: #666; margin-top: 2px; }

    .section { padding: 12px 16px; border-bottom: 1px solid #1e1e1e; }

    .stat-row {
      display: flex; justify-content: space-between;
      font-size: 12px; margin-bottom: 6px;
    }
    .stat-row .label { color: #888; }
    .stat-row .value { font-weight: 600; color: #f0f0f0; }
    .stat-row .value.green  { color: #4ade80; }
    .stat-row .value.red    { color: #f87171; }
    .stat-row .value.yellow { color: #fbbf24; }

    .progress-bar {
      width: 100%; height: 4px; background: #2a2a2a;
      border-radius: 2px; margin: 8px 0;
    }
    .progress-fill {
      height: 100%; background: #7c9ff7;
      border-radius: 2px; transition: width 0.3s;
      width: 0%;
    }

    .btn {
      width: 100%; padding: 9px 12px;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn:hover   { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start  { background: #7c9ff7; color: #000; }
    .btn-stop   { background: #f87171; color: #000; display: none; }
    .btn-reset  { background: #2a2a2a; color: #888; margin-top: 6px; font-size: 11px; padding: 6px; }

    .status {
      font-size: 11px; color: #888;
      text-align: center; padding: 6px 0 0;
      min-height: 18px;
    }
    .status.running { color: #7c9ff7; }
    .status.done    { color: #4ade80; }
    .status.error   { color: #f87171; }

    .instruction {
      font-size: 11px; color: #555; line-height: 1.5;
      padding: 10px 16px;
    }
    .instruction a { color: #7c9ff7; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>remote100k Scraper</h1>
    <p>Saves company application URLs to Supabase</p>
  </div>

  <div class="section">
    <div class="stat-row">
      <span class="label">Companies queued</span>
      <span class="value yellow" id="stat-queued">0</span>
    </div>
    <div class="stat-row">
      <span class="label">Processed</span>
      <span class="value green" id="stat-done">0</span>
    </div>
    <div class="stat-row">
      <span class="label">Failed</span>
      <span class="value red" id="stat-failed">0</span>
    </div>
    <div class="stat-row">
      <span class="label">Jobs found</span>
      <span class="value" id="stat-jobs">0</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <button class="btn btn-start" id="btn-start" disabled>Start Scraping</button>
    <button class="btn btn-stop"  id="btn-stop">Stop</button>
    <button class="btn btn-reset" id="btn-reset">Reset</button>

    <div class="status" id="status">—</div>
  </div>

  <div class="instruction">
    1. Open <a href="https://remote100k.com/remote-companies" target="_blank">remote100k.com/remote-companies</a><br>
    2. Wait for page to load fully<br>
    3. Come back here and click <strong>Start Scraping</strong>
  </div>

  <script src="popup.js"></script>
</body>
</html>
